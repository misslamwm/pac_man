<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>指數吃豆人：跨平台終極挑戰 - Indices PAC-MAN Ultimate</title>
    <!-- 引入 KaTeX，確保數學公式能夠以最完美的學術格式渲染 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <style>
        :root {
            --arcade-bg: #090a15;
            --panel-bg: #121424;
            --neon-blue: #00f0ff;
            --neon-yellow: #ffea00;
            --neon-pink: #ff007f;
            --neon-green: #39ff14;
            --neon-purple: #b026ff;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--arcade-bg);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 240, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 0, 127, 0.15) 0px, transparent 50%);
            transition: background 0.5s ease;
        }

        /* 雙欄響應式外殼 */
        .game-wrapper {
            display: flex;
            flex-direction: row;
            background: var(--panel-bg);
            border: 4px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4), inset 0 0 15px rgba(0, 240, 255, 0.1);
            border-radius: 24px;
            padding: 25px;
            width: 95vw;
            max-width: 980px;
            height: 90vh;
            max-height: 720px;
            gap: 25px;
            position: relative;
            transition: all 0.5s ease;
        }

        /* 左側：遊戲主畫面與狀態 */
        .game-left {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 右側：題目顯示、進度與控制器 */
        .game-right {
            flex: 0.8;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(0, 240, 255, 0.2);
            border-radius: 16px;
            padding: 20px;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .marquee {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 10px var(--neon-yellow);
            letter-spacing: 2px;
        }

        .level-badge {
            background: var(--neon-purple);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.95rem;
            box-shadow: 0 0 10px var(--neon-purple);
            letter-spacing: 1px;
        }

        /* 畫布容器 */
        .canvas-container {
            position: relative;
            background: #000;
            border: 3px solid #1a1b35;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            outline: none; /* 移除點擊聚焦時的邊框 */
        }

        /* 狀態列 */
        .status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-size: 1.15rem;
            font-weight: bold;
            color: var(--neon-blue);
            text-shadow: 0 0 5px var(--neon-blue);
        }

        .lives-container {
            color: var(--neon-pink);
            text-shadow: 0 0 5px var(--neon-pink);
        }

        /* 頂部題目顯示器 */
        .hud-display {
            background: #000;
            border: 3px solid var(--neon-pink);
            border-radius: 14px;
            padding: 20px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(255, 0, 127, 0.4), 0 0 10px rgba(255, 0, 127, 0.2);
            margin-bottom: 15px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hud-label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--neon-pink);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1.5px;
        }

        .hud-question {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px #fff, 0 0 20px var(--neon-pink);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 進度條 */
        .progress-container {
            margin-bottom: 15px;
        }
        .progress-text {
            font-size: 0.9rem;
            color: #aaa;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-green));
            height: 100%;
            width: 0%;
            box-shadow: 0 0 8px var(--neon-green);
            transition: width 0.4s ease;
        }

        /* 虛擬方向盤 */
        .controller {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 12px;
            justify-content: center;
            align-content: center;
            margin-top: 10px;
        }

        .dpad-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 3px solid var(--neon-blue);
            color: var(--neon-blue);
            font-size: 2.2rem;
            font-weight: bold;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
            transition: all 0.1s ease;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .dpad-btn:active {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 20px var(--neon-blue);
            transform: scale(0.95);
        }

        /* 全螢幕覆蓋畫面 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 6, 15, 0.98);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 30px;
            text-align: center;
        }

        .overlay-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--neon-yellow);
            text-shadow: 0 0 20px var(--neon-yellow);
            margin-bottom: 20px;
        }

        .overlay-desc {
            font-size: 1.1rem;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 25px;
            max-width: 85%;
        }

        /* 答錯防禦講解 Overlay */
        .explanation-card {
            background: #181124;
            border: 4px solid var(--neon-pink);
            box-shadow: 0 0 35px var(--neon-pink);
            border-radius: 20px;
            padding: 30px;
            max-width: 550px;
            width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .explanation-title {
            font-size: 2rem;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .explanation-item {
            font-size: 1.25rem;
            margin-bottom: 12px;
            color: #fff;
            text-align: center;
        }

        .explanation-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 0, 127, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            width: 100%;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #ffb8ff;
            text-align: left;
        }

        /* 按鈕容器 */
        .button-group {
            display: flex;
            flex-direction: row;
            gap: 20px;
            margin-top: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-start {
            background: rgba(0, 0, 0, 0.5);
            color: var(--neon-green);
            border: 3px solid var(--neon-green);
            padding: 18
